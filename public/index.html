<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebAR</title>
    <meta name="description" content="Realidad aumentada desde la propia web" />
    <style>
      :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #15171a; --muted: #5b6270; --accent: #2f6fed; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111317; --fg: #eef0f3; --muted: #9aa3b2; --accent: #7aa5ff; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
        font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
      main { max-width: 32rem; width: 100%; text-align: center; }
      p { color: var(--muted); }
      button { font: inherit; padding: 0.7rem 1.2rem; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
      video { width: 100%; margin-top: 1rem; border-radius: 12px; display: none; background: #000; }
    </style>
  </head>
  <body>
    <main>
      <h1>WebAR</h1>
      <p>Realidad aumentada desde la propia web. En construcción para la hackathon.</p>
      <button id="camara" type="button">Probar la cámara</button>
      <p id="estado" role="status"></p>
      <video id="video" autoplay playsinline muted></video>
    </main>
    <script>
      // Comprueba que el navegador da la cámara trasera por HTTPS: es lo que
      // necesitará la realidad aumentada.
      const estado = document.getElementById('estado')
      const video = document.getElementById('video')
      document.getElementById('camara').addEventListener('click', async () => {
        try {
          video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
          video.style.display = 'block'
          estado.textContent = 'Cámara funcionando.'
        } catch (error) {
          estado.textContent = 'No hay cámara: ' + error.message
        }
      })
    </script>
  </body>
</html>
